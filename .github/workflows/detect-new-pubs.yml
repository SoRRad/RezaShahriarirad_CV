name: Detect New Publications

on:
  schedule:
    - cron: '0 8 * * 0'   # Every Sunday at 8:00 AM UTC
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Detect new publications
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import requests, pandas as pd, pathlib, json, difflib, csv, io
          from datetime import date

          DATA = pathlib.Path('data')
          OUTPUT = DATA / 'new_publications_detected.csv'

          # ── Load existing publications ────────────────────────────────────
          text = (DATA / 'publications.csv').read_text(encoding='utf-8')
          data_lines = [l for l in text.splitlines() if not l.startswith('#')]
          existing_df = pd.read_csv(io.StringIO('\n'.join(data_lines)), dtype=str, keep_default_na=False)
          existing_titles = list(existing_df['title'].str.strip().str.lower())

          def title_known(title):
              t = title.strip().lower()
              for et in existing_titles:
                  if difflib.SequenceMatcher(None, t, et).ratio() >= 0.85:
                      return True
              return False

          new_pubs = []
          today = str(date.today())

          # ── PubMed search ─────────────────────────────────────────────────
          try:
              search_url = (
                  'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi'
                  '?db=pubmed&term=Shahriarirad+R[Author]&retmax=300&retmode=json'
              )
              r = requests.get(search_url, timeout=30)
              pmids = r.json().get('esearchresult', {}).get('idlist', [])
              print(f'PubMed: found {len(pmids)} PMIDs')

              if pmids:
                  fetch_url = (
                      'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi'
                      f'?db=pubmed&id={",".join(pmids[:50])}&retmode=xml&rettype=abstract'
                  )
                  import xml.etree.ElementTree as ET
                  fr = requests.get(fetch_url, timeout=60)
                  root = ET.fromstring(fr.content)
                  for article in root.findall('.//PubmedArticle'):
                      try:
                          pmid = article.findtext('.//PMID', '')
                          title = article.findtext('.//ArticleTitle', '').strip()
                          journal = article.findtext('.//Journal/Title', '').strip()
                          year = article.findtext('.//PubDate/Year', '') or article.findtext('.//PubDate/MedlineDate', '')[:4]
                          authors_list = article.findall('.//Author')
                          authors = ', '.join(
                              f"{a.findtext('LastName','')} {a.findtext('Initials','')}"
                              for a in authors_list if a.findtext('LastName')
                          )
                          doi = ''
                          for aid in article.findall('.//ArticleId'):
                              if aid.get('IdType') == 'doi':
                                  doi = f'https://doi.org/{aid.text}'
                          if title and not title_known(title):
                              new_pubs.append({
                                  'source': 'pubmed',
                                  'external_id': pmid,
                                  'title': title,
                                  'authors': authors,
                                  'journal': journal,
                                  'year': year,
                                  'url': doi,
                                  'detected_date': today,
                              })
                      except Exception:
                          pass
          except Exception as e:
              print(f'PubMed fetch error: {e}')

          # ── ORCID search ──────────────────────────────────────────────────
          try:
              orcid_url = 'https://pub.orcid.org/v3.0/0000-0001-5454-495X/works'
              headers = {'Accept': 'application/json'}
              r = requests.get(orcid_url, headers=headers, timeout=30)
              works = r.json().get('group', [])
              print(f'ORCID: found {len(works)} works')
              for work in works:
                  try:
                      summary = work.get('work-summary', [{}])[0]
                      put_code = str(summary.get('put-code', ''))
                      title = summary.get('title', {}).get('title', {}).get('value', '').strip()
                      year = str(summary.get('publication-date', {}).get('year', {}).get('value', '') or '')
                      journal = summary.get('journal-title', {}).get('value', '') or ''
                      url = ''
                      for extid in summary.get('external-ids', {}).get('external-id', []):
                          if extid.get('external-id-type') == 'doi':
                              url = f"https://doi.org/{extid.get('external-id-value','')}"
                      if title and not title_known(title):
                          new_pubs.append({
                              'source': 'orcid',
                              'external_id': put_code,
                              'title': title,
                              'authors': '',
                              'journal': journal,
                              'year': year,
                              'url': url,
                              'detected_date': today,
                          })
                  except Exception:
                      pass
          except Exception as e:
              print(f'ORCID fetch error: {e}')

          # ── Write results ─────────────────────────────────────────────────
          if not new_pubs:
              print('No new publications detected.')
              if OUTPUT.exists():
                  OUTPUT.unlink()
          else:
              fields = ['source','external_id','title','authors','journal','year','url','detected_date']
              out = io.StringIO()
              w = csv.DictWriter(out, fieldnames=fields, lineterminator='\n')
              w.writeheader()
              w.writerows(new_pubs)
              OUTPUT.write_text(out.getvalue(), encoding='utf-8')
              print(f'Wrote {len(new_pubs)} new publication(s) to {OUTPUT}')

              # ── Create GitHub issue ───────────────────────────────────────
              import os
              token = os.environ.get('GITHUB_TOKEN', '')
              repo  = os.environ.get('GITHUB_REPOSITORY', '')
              if token and repo:
                  body_lines = [
                      f'The weekly publication scan detected **{len(new_pubs)} new publication(s)** not found in `data/publications.csv`.',
                      '',
                      'Please review and add to the CSV as appropriate.',
                      '',
                      '| # | Source | Year | Title | Journal | URL |',
                      '|---|--------|------|-------|---------|-----|',
                  ]
                  for i, p in enumerate(new_pubs, 1):
                      link = f'[link]({p["url"]})' if p['url'] else '—'
                      body_lines.append(f'| {i} | {p["source"]} | {p["year"]} | {p["title"][:80]} | {p["journal"]} | {link} |')
                  body_lines += ['', f'_Detected on {today}_']
                  requests.post(
                      f'https://api.github.com/repos/{repo}/issues',
                      headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'},
                      json={
                          'title': 'New publications detected — review required',
                          'body': '\n'.join(body_lines),
                          'labels': ['publications'],
                      },
                      timeout=20,
                  )
                  print('Created GitHub issue.')
          PYEOF
