name: Update CV Weekly

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'

      - name: Install docx
        run: npm install docx

      - name: Fetch live stats
        run: |
          node << 'JSEOF'
          const https = require('https');
          const fs = require('fs');

          function get(url) {
            return new Promise((resolve) => {
              https.get(url, { headers: { 'User-Agent': 'Mozilla/5.0' } }, (res) => {
                let data = '';
                res.on('data', d => data += d);
                res.on('end', () => resolve(data));
              }).on('error', () => resolve(''));
            });
          }

          async function main() {
            const scholar = await get('https://scholar.google.com/citations?user=mOE1KmEAAAAJ&hl=en');
            const blocks = [...scholar.matchAll(/<td[^>]*class="gsc_rsb_std"[^>]*>(\d[\d,]*)<\/td>/g)];
            const citations = blocks[0]?.[1]?.replace(/,/g,'') || '3248';
            const hindex    = blocks[2]?.[1] || '24';

            const wos = await get('https://www.webofscience.com/wos/author/record/ABC-9194-2020');
            const revMatch = wos.match(/(\d+)\s*peer\s*reviews?/i);
            const peerReviews = revMatch?.[1] || '149';

            const stats = {
              citations, hindex, peerReviews,
              journals: '67', manuscripts: '129', pubCount: '193',
              firstAuth: '20', secondAuth: '31', lastAuth: '50', corrAuth: '68',
              date: new Date().toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' }),
            };
            fs.writeFileSync('cv_live_stats.json', JSON.stringify(stats, null, 2));
            console.log('Stats:', JSON.stringify(stats));
          }
          main().catch(e => { console.error(e); process.exit(1); });
          JSEOF

      - name: Generate CV DOCX
        run: |
          node << 'JSEOF'
          const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell,
                  AlignmentType, BorderStyle, WidthType, ShadingType,
                  ExternalHyperlink, UnderlineType, PageNumber, Header, Footer } = require('docx');
          const fs = require('fs');

          const stats = JSON.parse(fs.readFileSync('cv_live_stats.json', 'utf8'));
          const CITATIONS    = stats.citations;
          const HINDEX       = stats.hindex;
          const PEER_REVIEWS = stats.peerReviews;
          const JOURNALS     = stats.journals;
          const MANUSCRIPTS  = stats.manuscripts;
          const PUB_COUNT    = stats.pubCount;
          const DATE_STR     = stats.date;
          const FIRST_AUTH   = stats.firstAuth;
          const SECOND_AUTH  = stats.secondAuth;
          const LAST_AUTH    = stats.lastAuth;
          const CORR_AUTH    = stats.corrAuth;

          const NAVY  = '0A1628';
          const GOLD  = 'B8953A';
          const STEEL = '4A607E';
          const MUTED = '6B84A0';
          const BLACK = '000000';
          const W     = 12240;
          const MARGIN = 1080;
          const CW    = W - 2 * MARGIN;

