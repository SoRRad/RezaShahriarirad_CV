name: Build & Deploy CV

on:
  push:
    branches: [main]
    paths:
      - 'data/**/*.csv'
      - 'build/**'
      - 'assets/**'
      - 'scripts/**'
      - 'tools/admin-local/**'
      - 'push_to_github.*'
      - '.github/workflows/update-cv.yml'
      - 'README.md'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PDF build system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libreoffice-writer \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libcairo2 \
            libgdk-pixbuf2.0-0 \
            libffi-dev

      - name: Install Python requirements
        run: pip install -r build/requirements.txt

      - name: Attempt cached metric refresh
        continue-on-error: true
        run: |
          python << 'PYEOF'
          import csv
          import datetime as dt
          import json
          import pathlib
          import re
          import urllib.request

          root = pathlib.Path('.')
          profile_path = root / 'data' / 'profile.csv'

          def get(url, timeout=20):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.read().decode('utf-8', errors='ignore')

          def load_profile():
              comments = []
              rows = []
              with profile_path.open(encoding='utf-8-sig', newline='') as handle:
                  for line in handle:
                      if line.startswith('#'):
                          comments.append(line.rstrip('\n'))
                      else:
                          rows.append(line)
              parsed = list(csv.DictReader(rows))
              return comments, parsed

          def write_profile(comments, rows):
              fields = ['field', 'value']
              out_lines = []
              if comments:
                  out_lines.extend(comments)
              import io
              buffer = io.StringIO()
              writer = csv.DictWriter(buffer, fieldnames=fields, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)
              out_lines.append(buffer.getvalue().rstrip('\n'))
              profile_path.write_text('\n'.join(out_lines) + '\n', encoding='utf-8')

          comments, rows = load_profile()
          profile = {row['field']: row['value'] for row in rows}
          stats = {}

          def as_int(value):
              try:
                  return int(str(value or '').replace(',', '').strip())
              except ValueError:
                  return None

          try:
              raw = get(profile.get('scholar_url', ''))
              blocks = re.findall(r'<td[^>]*class="gsc_rsb_std"[^>]*>(\d[\d,]*)</td>', raw)
              if len(blocks) >= 3:
                  fetched_citations = as_int(blocks[0])
                  fetched_h_index = as_int(blocks[2])
                  current_citations = as_int(profile.get('citations_cached', ''))
                  current_h_index = as_int(profile.get('h_index_cached', ''))
                  if fetched_citations is not None and (
                      current_citations is None or fetched_citations >= current_citations
                  ):
                      stats['citations_cached'] = str(fetched_citations)
                  elif fetched_citations is not None:
                      print(f'Skipping citation downgrade: fetched {fetched_citations}, cached {current_citations}')
                  if fetched_h_index is not None and (
                      current_h_index is None or fetched_h_index >= current_h_index
                  ):
                      stats['h_index_cached'] = str(fetched_h_index)
                  elif fetched_h_index is not None:
                      print(f'Skipping h-index downgrade: fetched {fetched_h_index}, cached {current_h_index}')
          except Exception as exc:
              print(f'Google Scholar metric refresh skipped: {exc}')

          if stats:
              stats['metrics_last_updated'] = dt.date.today().strftime('%B %-d, %Y')
              for row in rows:
                  if row['field'] in stats:
                      row['value'] = stats[row['field']]
              write_profile(comments, rows)
              print('Updated cached metrics:', json.dumps(stats))
          else:
              print('No cached metric changes; continuing with existing data/profile.csv values.')
          PYEOF

      - name: Validate CSV data
        run: python build/validate_data.py

      - name: Run CV build
        run: python build/build.py

      - name: Debug generated publication output
        run: |
          python << 'PYEOF'
          import csv
          import html
          import os
          import pathlib

          root = pathlib.Path('.')
          rows = []
          with (root / 'data' / 'publications.csv').open(encoding='utf-8-sig', newline='') as handle:
              for line in handle:
                  if not line.startswith('#'):
                      rows.append(line)
          pubs = list(csv.DictReader(rows))
          last = pubs[-1] if pubs else {}
          title = (last.get('title') or '').strip()
          index_text = (root / 'index.html').read_text(encoding='utf-8') if (root / 'index.html').exists() else ''
          contains = bool(title and any(variant in index_text for variant in (title, html.escape(title, quote=True), title.replace('&', '&amp;'))))
          print(f"Current commit SHA being deployed: {os.environ.get('GITHUB_SHA', '')}")
          print(f"Rows in data/publications.csv: {len(pubs)}")
          print(f"Last publication number/title: #{(last.get('n') or '').strip()} {title}")
          print(f"Generated index.html contains last title: {contains}")
          if title and not contains:
              raise SystemExit("Generated index.html is missing the newest publication title")
          PYEOF

      - name: Smoke test generated site
        run: python build/smoke_test.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html \
                  Shahriarirad_Reza_CV.docx \
                  Shahriarirad_Reza_CV.pdf \
                  cv_pubs.json \
                  cv_presentations.json \
                  cv_journals.json \
                  cv_live_stats.json \
                  data/profile.csv
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update CV $(date +'%Y-%m-%d')"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Prepare public site
        run: |
          rm -rf site_public
          mkdir site_public
          cp index.html site_public/
          cp Shahriarirad_Reza_CV.docx site_public/
          cp Shahriarirad_Reza_CV.pdf site_public/
          cp cv_pubs.json site_public/
          cp cv_presentations.json site_public/
          cp cv_journals.json site_public/
          cp cv_live_stats.json site_public/
          if [ -d assets ]; then
            cp -R assets site_public/assets
          fi
          if [ -d images ]; then
            cp -R images site_public/images
          fi
          if [ -d img ]; then
            cp -R img site_public/img
          fi
          if [ -d public ]; then
            cp -R public site_public/public
          fi
          if [ -d static ]; then
            cp -R static site_public/static
          fi
          if [ -d build/static_assets/logos ]; then
            mkdir -p site_public/build/static_assets
            cp -R build/static_assets/logos site_public/build/static_assets/logos
          fi

      - name: Verify deployment payload
        run: |
          test -s site_public/index.html
          test -s site_public/Shahriarirad_Reza_CV.docx
          test -s site_public/Shahriarirad_Reza_CV.pdf
          test -s site_public/cv_pubs.json
          test -s site_public/cv_presentations.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site_public
          publish_branch: gh-pages
