name: Build & Deploy CV

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 6:00 AM UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Live stats fetch (kept from original workflow) ──────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch live stats
        run: |
          node << 'JSEOF'
          const https = require('https');
          const fs = require('fs');

          function get(url) {
            return new Promise((resolve) => {
              https.get(url, { headers: { 'User-Agent': 'Mozilla/5.0' } }, (res) => {
                let data = '';
                res.on('data', d => data += d);
                res.on('end', () => resolve(data));
              }).on('error', () => resolve(''));
            });
          }

          async function main() {
            const scholar = await get('https://scholar.google.com/citations?user=mOE1KmEAAAAJ&hl=en');
            const blocks = [...scholar.matchAll(/<td[^>]*class="gsc_rsb_std"[^>]*>(\d[\d,]*)<\/td>/g)];
            const citations = blocks[0]?.[1]?.replace(/,/g,'') || '3248';
            const hindex    = blocks[2]?.[1] || '24';

            const wos = await get('https://www.webofscience.com/wos/author/record/ABC-9194-2020');
            const revMatch = wos.match(/(\d+)\s*peer\s*reviews?/i);
            const peerReviews = revMatch?.[1] || '149';

            const stats = {
              citations, hindex, peerReviews,
              journals: '67', manuscripts: '129', pubCount: '193',
              firstAuth: '20', secondAuth: '31', lastAuth: '50', corrAuth: '68',
              date: new Date().toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' }),
            };
            fs.writeFileSync('cv_live_stats.json', JSON.stringify(stats, null, 2));
            console.log('Stats:', JSON.stringify(stats));
          }
          main().catch(e => { console.error(e); process.exit(1); });
          JSEOF

      # ── Sync live stats into profile.csv so build picks them up ─────────
      - name: Sync live stats into profile.csv
        run: |
          python3 << 'PYEOF'
          import json, csv, pathlib, io

          stats_raw = pathlib.Path('cv_live_stats.json').read_text()
          stats = json.loads(stats_raw)

          csv_path = pathlib.Path('data/profile.csv')
          text = csv_path.read_text(encoding='utf-8')
          rows = list(csv.reader(io.StringIO(text)))

          fields_to_update = {
              'h_index_cached':      stats['hindex'],
              'citations_cached':    stats['citations'],
              'peer_reviews':        stats['peerReviews'],
              'journals_reviewed':   stats['journals'],
              'manuscripts_reviewed':stats['manuscripts'],
          }

          updated_rows = []
          for row in rows:
              if len(row) >= 2 and row[0] in fields_to_update:
                  updated_rows.append([row[0], fields_to_update[row[0]]])
              else:
                  updated_rows.append(row)

          out = io.StringIO()
          w = csv.writer(out)
          w.writerows(updated_rows)
          csv_path.write_text(out.getvalue(), encoding='utf-8')
          print('Updated profile.csv with live stats:', fields_to_update)
          PYEOF

      # ── Python build ─────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libcairo2 \
            libgdk-pixbuf2.0-0 \
            libffi-dev

      - name: Install Python requirements
        run: pip install -r build/requirements.txt

      - name: Run CV build
        run: python build/build.py

      # ── Commit generated outputs ─────────────────────────────────────────
      - name: Commit and push generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html \
                  Shahriarirad_Reza_CV.docx \
                  Shahriarirad_Reza_CV.pdf \
                  cv_live_stats.json \
                  data/profile.csv
          git diff --staged --quiet || \
            git commit -m "Auto-update CV stats $(date +'%Y-%m-%d')" && git push
