          function heading(title) {
            return new Paragraph({
              children:[rb(title, {color:NAVY, size:22, allCaps:true})],
              spacing:{before:240, after:60},
              border:{bottom:{style:BorderStyle.SINGLE, size:8, color:GOLD, space:4}},
            });
