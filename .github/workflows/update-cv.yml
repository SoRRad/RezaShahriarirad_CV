name: Build & Deploy CV

on:
  push:
    branches: [main]
    paths:
      - 'data/**/*.csv'
      - 'build/**'
      - 'assets/**'
      - 'scripts/**'
      - 'tools/admin-local/**'
      - '.github/workflows/update-cv.yml'
      - 'README.md'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PDF build system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libreoffice-writer \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libcairo2 \
            libgdk-pixbuf2.0-0 \
            libffi-dev

      - name: Install Python requirements
        run: pip install -r build/requirements.txt

      - name: Refresh Google Scholar metrics
        continue-on-error: true
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python build/refresh_metrics.py

      - name: Warn when cached metrics are stale
        continue-on-error: true
        run: |
          python << 'PYEOF'
          import csv
          import datetime as dt
          import os
          import pathlib

          rows = [
              line
              for line in pathlib.Path('data/profile.csv').open(encoding='utf-8-sig')
              if not line.startswith('#')
          ]
          profile = {r['field']: r['value'] for r in csv.DictReader(rows)}
          raw = profile.get('metrics_last_updated', '').strip()
          try:
              updated = dt.datetime.strptime(raw, '%B %d, %Y').date()
          except ValueError:
              print(f"::warning::metrics_last_updated ('{raw}') is not parseable; cannot check staleness.")
              raise SystemExit(0)
          age = (dt.date.today() - updated).days
          msg = (
              f"Cached Scholar metrics (citations {profile.get('citations_cached','?')}, "
              f"h-index {profile.get('h_index_cached','?')}) were last updated {raw} ({age} days ago)."
          )
          print(msg)
          if age > 45:
              print(f"::warning::{msg} The automated Google Scholar refresh is usually blocked (HTTP 403); "
                    "please update citations_cached / h_index_cached / metrics_last_updated in data/profile.csv manually.")
              summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary:
                  with open(summary, 'a', encoding='utf-8') as fh:
                      fh.write(f"### Stale citation metrics\n\n{msg} Update `data/profile.csv` from Google Scholar.\n")
          PYEOF

      - name: Validate CSV data
        run: python build/validate_data.py

      - name: Run build unit tests
        run: python build/test_utils.py

      - name: Run CV build
        run: python build/build.py

      - name: Debug generated publication output
        run: |
          python << 'PYEOF'
          import csv
          import html
          import os
          import pathlib

          root = pathlib.Path('.')
          rows = []
          with (root / 'data' / 'publications.csv').open(encoding='utf-8-sig', newline='') as handle:
              for line in handle:
                  if not line.startswith('#'):
                      rows.append(line)
          pubs = list(csv.DictReader(rows))
          last = pubs[-1] if pubs else {}
          title = (last.get('title') or '').strip()
          index_text = (root / 'index.html').read_text(encoding='utf-8') if (root / 'index.html').exists() else ''
          contains = bool(title and any(variant in index_text for variant in (title, html.escape(title, quote=True), title.replace('&', '&amp;'))))
          print(f"Current commit SHA being deployed: {os.environ.get('GITHUB_SHA', '')}")
          print(f"Rows in data/publications.csv: {len(pubs)}")
          print(f"Last publication number/title: #{(last.get('n') or '').strip()} {title}")
          print(f"Generated index.html contains last title: {contains}")
          if title and not contains:
              raise SystemExit("Generated index.html is missing the newest publication title")
          PYEOF

      - name: Smoke test generated site
        run: python build/smoke_test.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html \
                  Shahriarirad_Reza_CV.docx \
                  Shahriarirad_Reza_CV.pdf \
                  cv_pubs.json \
                  cv_presentations.json \
                  cv_journals.json \
                  cv_live_stats.json \
                  data/profile.csv
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update CV $(date +'%Y-%m-%d')"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Prepare public site
        run: |
          rm -rf site_public
          mkdir site_public
          cp index.html site_public/
          # NOTE: the Word CV (.docx) is intentionally NOT copied into the public
          # payload. The DOCX stays in the repo but the public site links to the
          # PDF only; keep this in sync with the smoke test's DOCX-exclusion check.
          cp Shahriarirad_Reza_CV.pdf site_public/
          cp cv_pubs.json site_public/
          cp cv_presentations.json site_public/
          cp cv_journals.json site_public/
          cp cv_live_stats.json site_public/
          for seo in robots.txt sitemap.xml; do
            if [ -f "$seo" ]; then cp "$seo" site_public/; fi
          done
          if [ -d assets ]; then
            cp -R assets site_public/assets
          fi
          if [ -d images ]; then
            cp -R images site_public/images
          fi
          if [ -d img ]; then
            cp -R img site_public/img
          fi
          if [ -d public ]; then
            cp -R public site_public/public
          fi
          if [ -d static ]; then
            cp -R static site_public/static
          fi
          if [ -d build/static_assets/logos ]; then
            mkdir -p site_public/build/static_assets
            cp -R build/static_assets/logos site_public/build/static_assets/logos
          fi

      - name: Verify deployment payload
        run: |
          test -s site_public/index.html
          test -s site_public/Shahriarirad_Reza_CV.pdf
          test -s site_public/cv_pubs.json
          test -s site_public/cv_presentations.json
          # The Word CV must never be published to GitHub Pages.
          if [ -e site_public/Shahriarirad_Reza_CV.docx ]; then
            echo "ERROR: DOCX must not be in the public deployment payload" >&2
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site_public
          publish_branch: gh-pages
