      - name: Update live stats in index.html
        run: |
          node << 'JSEOF'
          const fs = require('fs');
          const stats = JSON.parse(fs.readFileSync('cv_live_stats.json','utf8'));
          let html = fs.readFileSync('index.html','utf8');
          html = html.replace(
            /(<div class="stat-num" id="hero-reviews">)\d+(<\/div>)/,
            `$1${stats.peerReviews}$2`
          );
          html = html.replace(
            /const liveData = \{[^}]+\}/,
            `const liveData = { citations: null, hindex: null, peerReviews: ${stats.peerReviews}, journals: ${stats.journals} }`
          );
          fs.writeFileSync('index.html', html);
          console.log('index.html updated');
          JSEOF

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Shahriarirad_Reza_CV.docx index.html cv_live_stats.json
          git diff --staged --quiet || git commit -m "Auto-update CV stats $(date +'%Y-%m-%d')"
          git push
